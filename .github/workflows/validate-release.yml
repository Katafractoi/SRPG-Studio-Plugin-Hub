name: Validate public plugin release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out sources without saving credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test validation and packaging safeguards
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Validate the public allowlist and hashes
        run: python3 tools/release.py validate
      - name: Package the exact tested commit twice, without uploading
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 tools/release.py package --source-commit "$SOURCE_COMMIT" --output "$RUNNER_TEMP/srpg-package-a"
          python3 tools/release.py package --source-commit "$SOURCE_COMMIT" --output "$RUNNER_TEMP/srpg-package-b"
          diff -rq "$RUNNER_TEMP/srpg-package-a" "$RUNNER_TEMP/srpg-package-b"
